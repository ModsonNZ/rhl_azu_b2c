<!DOCTYPE html>
<html lang="en-NZ">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Sign in · Regal Portal</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet" />

  <style>
    
    :root {
      --paper-50:  40 14% 96%;
      --paper-100: 40 11% 93%;
      --paper-200: 40  9% 88%;
      --ink-400:   45  6% 44%;
      --ink-500:   45  4% 40%;
      --ink-700:   45  5% 32%;
      --ink-950:   40  8%  9%;

      --brand-500: 38 42% 51%;
      --brand-700: 38 45% 37%;
      --brand-800: 38 47% 29%;
      
      --brand-foreground: 0 0% 100%;

      --nav:       40  8%  9%;
      --risk-600:   6 66% 47%;
      --risk-50:    6 76% 97%;

      --radius: 10px;
      --shadow-e2: 0 1px 2px hsl(40 8% 9% / .06), 0 4px 12px hsl(40 8% 9% / .07);

      --hero-image: url('https://modsonnz.github.io/rhl_azu_b2c/regal-truck.jpg');
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --paper-50:  260 9%  7%;
        --paper-100: 260 8% 12%;
        --paper-200: 260 6% 20%;
        --ink-400:   45  4% 52%;
        --ink-500:   45  4% 62%;
        --ink-700:   40  6% 78%;
        --ink-950:   40 12% 96%;
        --brand-500: 38 55% 62%;
        --brand-700: 38 60% 67%;
        --brand-800: 38 60% 76%;
        --brand-foreground: 260 8% 8%;
      }
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: hsl(var(--paper-50));
      color: hsl(var(--ink-950));
      font-family: 'Plus Jakarta Sans', ui-sans-serif, system-ui, -apple-system,
                   'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .shell {
      display: grid;
      grid-template-columns: 40% 60%;
      min-height: 100vh;
      min-height: 100dvh;
    }

    .form-panel {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 48px clamp(28px, 5vw, 72px);
      background: hsl(var(--paper-50));
      
      overflow-y: auto;
    }

    .form-inner { width: 100%; max-width: 380px; margin: 0 auto; }

    .brand-logo {
      width: 172px;
      height: auto;
      display: block;
      margin: 0 0 30px;
    }
    
    .brand-logo--dark { display: none; }
    @media (prefers-color-scheme: dark) {
      .brand-logo--light { display: none; }
      .brand-logo--dark { display: block; }
    }

    .footnote {
      margin: 28px 0 0;
      font-size: 11.5px;
      color: hsl(var(--ink-400));
    }
    .footnote a { color: hsl(var(--brand-700)); text-decoration: none; }
    .footnote a:hover { text-decoration: underline; }

    .hero {
      position: relative;
      overflow: hidden;
      background-color: hsl(var(--nav));
      background-image: var(--hero-image);
      background-size: cover;
      
      background-position: 74% center;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 44px clamp(32px, 4vw, 64px);
    }

    .hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        linear-gradient(to top,
          hsl(var(--nav) / .88) 0%,
          hsl(var(--nav) / .55) 22%,
          hsl(var(--nav) / .12) 48%,
          transparent 70%),
        
        radial-gradient(90% 60% at 85% 8%, hsl(var(--brand-500) / .16), transparent 62%);
    }

    .hero > * { position: relative; }

    .hero-copy { max-width: 30ch; }
    .hero-copy p {
      margin: 0;
      color: #fff;
      font-size: clamp(24px, 2.6vw, 34px);
      font-weight: 600;
      line-height: 1.2;
      letter-spacing: -.02em;
      text-wrap: balance;
    }
    
    #api { width: 100%; }

    #api h2 {
      font-size: 15px;
      font-weight: 600;
      color: hsl(var(--ink-950));
      margin: 0 0 14px;
    }

    #api .intro h2 { display: none; }

    #api h1 {
      font-size: 28px;
      font-weight: 600;
      letter-spacing: -.025em;
      line-height: 1.15;
      margin: 0 0 24px;
      color: hsl(var(--ink-950));
    }

    #api .entry-item,
    #api .attrEntry { margin-bottom: 14px; }

    #api label,
    #api .attrEntry label {
      display: block;
      margin-bottom: 6px;
      font-size: 12px;
      font-weight: 600;
      color: hsl(var(--ink-700));
    }

    #api input[type='text'],
    #api input[type='email'],
    #api input[type='password'],
    #api input[type='tel'],
    #api input[type='number'],
    #api select,
    #api .textInput {
      width: 100%;
      height: 40px;
      padding: 0 12px;
      font: inherit;
      font-size: 13.5px;
      color: hsl(var(--ink-950));
      background: #fff;
      border: 1px solid hsl(var(--paper-200));
      border-radius: 6px;
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    @media (prefers-color-scheme: dark) {
      #api input[type='text'],
      #api input[type='email'],
      #api input[type='password'],
      #api input[type='tel'],
      #api input[type='number'],
      #api select,
      #api .textInput { background: hsl(var(--paper-100)); }
    }

    #api input::placeholder { color: hsl(var(--ink-400)); }

    #api input:focus,
    #api select:focus,
    #api .textInput:focus {
      border-color: hsl(var(--brand-700));
      box-shadow: 0 0 0 3px hsl(var(--brand-700) / .15);
    }

    #api button,
    #api #next,
    #api #continue {
      width: 100%;
      height: 40px;
      margin-top: 4px;
      font: inherit;
      font-size: 13.5px;
      font-weight: 600;
      color: hsl(var(--brand-foreground));
      background: hsl(var(--brand-700));
      border: 1px solid hsl(var(--brand-700));
      border-radius: 6px;
      cursor: pointer;
      transition: background-color .15s, border-color .15s;
    }
    #api button:hover,
    #api #next:hover,
    #api #continue:hover {
      background: hsl(var(--brand-800));
      border-color: hsl(var(--brand-800));
    }
    #api button:focus-visible {
      outline: 2px solid hsl(var(--brand-700));
      outline-offset: 2px;
    }
    
    #api #cancel,
    #api .secondary {
      color: hsl(var(--ink-700));
      background: transparent;
      border-color: hsl(var(--paper-200));
    }
    #api #cancel:hover,
    #api .secondary:hover {
      background: hsl(var(--paper-100));
      border-color: hsl(var(--paper-200));
      color: hsl(var(--ink-950));
    }

    #api a { color: hsl(var(--brand-700)); text-decoration: none; font-weight: 500; }
    #api a:hover { text-decoration: underline; }

    #api .entry-item { display: flex; flex-direction: column; }
    #api .entry-item > label { order: 0; }
    #api .entry-item > .error { order: 1; }
    #api .entry-item > input,
    #api .entry-item > select { order: 2; }
    #api .entry-item > #forgotPassword { order: 3; }

    #api #forgotPassword {
      display: inline-block;
      align-self: flex-start;
      margin: 8px 0 0;
      font-size: 12.5px;
    }

    #api .error,
    #api .pageLevel,
    #api .itemLevel {
      color: hsl(var(--risk-600));
      font-size: 12.5px;
      font-weight: 500;
    }
    #api .error.pageLevel {
      padding: 10px 12px;
      margin-bottom: 16px;
      background: hsl(var(--risk-50));
      border: 1px solid hsl(var(--risk-600) / .3);
      border-radius: 6px;
    }
    @media (prefers-color-scheme: dark) {
      #api .error.pageLevel { background: hsl(var(--risk-600) / .12); }
    }
    
    #api .error:empty { display: none; }

    #api .divider,
    #api .create { display: none; }

    #api .options button,
    #api .accountButton {
      margin-bottom: 8px;
      color: hsl(var(--ink-950));
      background: #fff;
      border: 1px solid hsl(var(--paper-200));
    }
    #api .options button:hover,
    #api .accountButton:hover {
      background: hsl(var(--paper-100));
      border-color: hsl(var(--paper-200));
    }

    #api input[type='checkbox'] { width: auto; height: auto; margin-right: 8px; }
    #api input[type='checkbox'] + label { display: inline; font-weight: 400; }

    #api .verificationInfoText,
    #api .helpText { font-size: 12px; color: hsl(var(--ink-400)); }

    @media (max-width: 900px) {
      .shell { grid-template-columns: 1fr; }
      
      .hero {
        order: -1;
        min-height: 210px;
        padding: 24px 24px 26px;
        gap: 18px;
      }
      .hero-copy p { font-size: 20px; }
      
      .hero { background-position: 62% 42%; }
      .brand-logo { width: 140px; margin-bottom: 22px; }
      .form-panel { padding: 30px 24px 48px; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; animation: none !important; }
    }
  </style>
</head>

<body>
  <div class="shell">
    
    <main class="form-panel">
      <div class="form-inner">
        
        <img class="brand-logo brand-logo--light" src="https://modsonnz.github.io/rhl_azu_b2c/regal-logo.svg" alt="Regal Haulage" />
        <img class="brand-logo brand-logo--dark" src="https://modsonnz.github.io/rhl_azu_b2c/regal-logo-white.svg" alt="Regal Haulage" />

        <!-- Azure AD B2C injects the generated form here. -->
        <div id="api"></div>

        <p class="footnote">
          Trouble signing in? Call Regal on
          <a href="tel:+6478569149">07 856 9149</a> or email
          <a href="mailto:help@regalgroup.co.nz">help@regalgroup.co.nz</a>.
        </p>
      </div>
    </main>

    <aside class="hero" aria-hidden="true">
      <div class="hero-copy">
        <p>Bulk transport, moved on time.</p>
      </div>
    </aside>
  </div>
</body>
</html>
